$kind: http-request
url: "{{base_url}}/api/v1/agent/run"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "action": "get_report",
      "report_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const EXPECTED=200;
      pm.test("HTTP 상태 확인", function(){pm.response.to.have.status(EXPECTED);});
      pm.test("Action Router 동작",()=>pm.expect(pm.response.json().action).to.eql("get_report"));
    language: text/javascript
order: 11000
