$kind: http-request
description: Postman raw JSON은 숫자형이 필요합니다. 환경변수 치환 후 JSON 숫자여야 합니다.
url: "{{base_url}}/api/v1/prompts/{{seed_prompt_report_id}}/active-version"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "version_no": {{latest_prompt_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const EXPECTED=200;
      pm.test("HTTP 상태 확인", function(){pm.response.to.have.status(EXPECTED);});
      pm.test("활성 버전 반영",()=>pm.expect(pm.response.json().active_version_no).to.be.above(0));
    language: text/javascript
order: 1000
