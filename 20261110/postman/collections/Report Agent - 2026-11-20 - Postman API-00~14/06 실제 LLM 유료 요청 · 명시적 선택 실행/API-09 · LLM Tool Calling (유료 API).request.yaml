$kind: http-request
description: 실제 LLM 호출이므로 비용이 발생하며, 읽기·검색·요약 Tool만 허용합니다.
url: "{{base_url}}/api/v1/agent/run"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "agent_mode": "tool_calling",
      "message": "가중치에 관련된 보고서를 찾아 간단하게 설명해줘"
    }
scripts:
  - type: afterResponse
    code: |-
      const EXPECTED=200;
      pm.test("HTTP 상태 확인", function(){pm.response.to.have.status(EXPECTED);});
    language: text/javascript
  - type: beforeRequest
    code: |-
      // Environment에서 명시적으로 true를 설정한 경우에만 유료 요청을 보냅니다.
      if (pm.environment.get("allow_paid_llm") !== "true") {
        pm.execution.skipRequest();
      }
    language: text/javascript
order: 5000
