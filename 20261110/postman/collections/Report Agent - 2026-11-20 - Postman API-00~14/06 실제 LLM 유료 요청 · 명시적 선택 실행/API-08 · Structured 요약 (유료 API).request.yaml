$kind: http-request
description: 실제 LLM API로 JSON 구조화 요약을 수행합니다.
url: "{{base_url}}/api/v1/reports/1/summarize"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "style": "structured",
      "max_sentences": 3
    }
scripts:
  - type: afterResponse
    code: |-
      const EXPECTED=200;
      pm.test("HTTP 상태 확인", function(){pm.response.to.have.status(EXPECTED);});
    language: text/javascript
  - type: beforeRequest
    code: |-
      // Environment에서 명시적으로 true를 설정한 경우에만 유료 요청을 보냅니다.
      if (pm.environment.get("allow_paid_llm") !== "true") {
        pm.execution.skipRequest();
      }
    language: text/javascript
order: 4000
